# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The internal implementation namespace: the lint/typecheck/test/format
# primitives the root wrappers compose. Everything here is `internal: true` —
# it exists to be called from a wrapper, not run directly.
#
# `python-lib` runs the per-package tools once per workspace member, from that
# member's own directory, so a package's ruff and pyright settings are the ones
# that apply to it. The repo-wide checkers — generated-file drift, imports, task
# layout, CI entrypoints, docs — run once, at the root, because that is the
# scope they describe.

vars:
  PACKAGES: golden-alpha golden-beta

tasks:
  lint:python:
    desc: Lint every workspace package and scripts/ with ruff.
    internal: true
    cmds:
      - for: { var: PACKAGES, split: " " }
        cmd: uv run --directory packages/{{.ITEM}} --package {{.ITEM}} ruff check
      - uv run ruff check scripts

  lint:generated:
    desc: Fail if a kiln-generated file or block has drifted from the committed state.
    internal: true
    cmds:
      - uv run python scripts/standards/check_generated.py .

  lint:rn-forge-deps:
    desc: Enforce the archetype's rn-forge dependency contract — required, allowed, pinned.
    internal: true
    cmds:
      - uv run python scripts/standards/check_rn_forge_deps.py .

  lint:imports:
    desc: Enforce the import-boundary contracts in .importlinter.
    internal: true
    cmds:
      - uv run lint-imports

  lint:task-layout:
    desc: Enforce the wrapper/inner split, non-empty desc, and the validate gate.
    internal: true
    cmds:
      - uv run python scripts/task/check_task_layout.py .

  lint:ci-entrypoint:
    desc: Fail if a CI step invokes a wrapped tool instead of `task`.
    internal: true
    cmds:
      - uv run python scripts/ci/check_ci_entrypoint.py .

  lint:docs:
    desc: Check the docs site for broken links, bad anchors, and orphan pages.
    internal: true
    cmds:
      - uv run python scripts/docs/check_docs.py .

  lint:docs-structure:
    desc: Check the docs tree matches the area model.
    internal: true
    cmds:
      - task: :docs:structure

  lint:docs-nav:
    desc: Check mkdocs.yml's generated nav block is up to date.
    internal: true
    cmds:
      - task: :docs:nav
        vars:
          CLI_ARGS: --check

  format:python:
    desc: Format every workspace package and scripts/ in place with ruff.
    internal: true
    cmds:
      - for: { var: PACKAGES, split: " " }
        cmd: uv run --directory packages/{{.ITEM}} --package {{.ITEM}} ruff format
      - for: { var: PACKAGES, split: " " }
        cmd: uv run --directory packages/{{.ITEM}} --package {{.ITEM}} ruff check --fix
      - uv run ruff format scripts
      - uv run ruff check --fix scripts

  typecheck:python:
    desc: Type-check every workspace package with pyright in strict mode.
    internal: true
    cmds:
      - for: { var: PACKAGES, split: " " }
        cmd: uv run --directory packages/{{.ITEM}} --package {{.ITEM}} pyright src

  test:python:
    desc: Run each workspace package's pytest suite.
    internal: true
    cmds:
      - for: { var: PACKAGES, split: " " }
        cmd: uv run --directory packages/{{.ITEM}} --package {{.ITEM}} pytest -q

  test:coverage:
    desc: Run the whole workspace's tests with an XML coverage report for Sonar.
    internal: true
    cmds:
      - uv run pytest -q --cov=golden_alpha --cov=golden_beta --cov-report=xml:coverage.xml
