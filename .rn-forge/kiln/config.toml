# The one hand-authored input kiln reads (kiln ADR-0004). Edit this, then run
# `kiln apply`. Everything else under .rn-forge/kiln/ is kiln's.
#
# kiln's own config. kiln generates its own skeleton from it: the `python-app`
# archetype with `lifecycle = true`, the module declared below.
schema_version = 1

[repository]
name = "kiln"
archetype = "python-app"
lifecycle = true

[archetype."python-app"]
module = "rn_forge.kiln"

[docs]
profile = "mkdocs"
site_dir = ".docs-site"

[ci]
provider = "github"
sonar = true
release = "tag-exists"
doctor_full = "every-run"

[ci.hooks]
setup = ["./.github/actions/setup-node"]

[[ci.jobs]]
name = "golden-render"
uses = "./.github/workflows/golden-render.yml"
events = ["pull_request"]

[tasks]
includes = [{ namespace = "self", taskfile = "tasks/self.yml" }]

# The command line this repo exposes, built by `CliApp.from_config` rather
# than assembled by hand (kiln ADR-0002). F4.5 adds the rest of the surface to
# this table; `check` is here first because it is what CI runs
# (kiln ADR-0006).
[cli]
name = "kiln"
help = "The rn-forge repository generator, and the canon it generates against."

[[cli.commands]]
name = "doctor"
target = "rn_forge.kiln.commands:doctor"

[[cli.commands]]
name = "docs-generate"
target = "rn_forge.kiln.commands:docs_generate"

[[cli.commands]]
name = "new"
target = "rn_forge.kiln.commands:new"

[[cli.commands]]
name = "init"
target = "rn_forge.kiln.commands:init"

[[cli.commands]]
name = "apply"
target = "rn_forge.kiln.commands:apply"

[[cli.commands]]
name = "generate"
target = "rn_forge.kiln.commands:generate_app"

[[cli.commands]]
name = "config-update"
target = "rn_forge.kiln.commands:config_update"

[[cli.commands]]
name = "config-upgrade"
target = "rn_forge.kiln.commands:config_upgrade"

[[cli.commands]]
name = "diff"
target = "rn_forge.kiln.commands:diff"

[[cli.commands]]
name = "version"
target = "rn_forge.kiln.commands:version"

[[cli.commands]]
name = "prompt"
target = "rn_forge.kiln.commands:prompt"

# The lifecycle verbs, mounted by rn-forge-tooling's `build_tool_app`
# under `kiln self`: they manage the installed tool, and `kiln doctor`
# keeps meaning the repository check.
[lifecycle]
product = "rn_forge.kiln.product:PRODUCT"
namespace = "self"
verbs = ["install", "upgrade", "uninstall", "cleanup", "status", "doctor"]
