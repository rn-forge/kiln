site_name: kiln
site_description: The rn-forge repository standard, its decisions, and the generator that renders it.
docs_dir: docs
exclude_docs: "_*"
strict: true
theme:
  name: material
  # Each area is a tab with its own sidebar (kiln ADR-0013); an area's
  # index.md is the tab's page, so no area's pages stack on another's.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
# The nav below is derived by `kiln docs-generate` from docs/_areas.yml and
# the tree — do not hand-edit between the markers; run `task docs:generate`
# after adding a page. `task lint` fails on a stale nav.
nav:
  # BEGIN derived nav
  - Home: index.md
  - Architecture:
    - architecture/index.md
    - The rn-forge workspace: architecture/workspace.md
  - Guides:
    - guides/index.md
    - Development: guides/development.md
  - Runbooks:
    - runbooks/index.md
    - Creating a repository: runbooks/creating-a-repo.md
  - Reference:
    - Python API: reference/python-api.md
    - The standard repository: reference/standard-repo.md
  - Releases: releases/index.md
  - Specs: specs/index.md
  - Decisions: adr/index.md
  - Plans:
    - plans/index.md
    - Context — how kiln got here: plans/context.md
    - Reviews: plans/reviews/index.md
    - intellibuild — standalone plan: plans/intellibuild.md
    - Agent configuration after kiln — parked: plans/agent-config-future.md
    - pykit docs alignment — standalone plan: plans/pykit-docs-alignment.md
    - rn-forge repo standardization — plan of action: plans/standardization-plan.md
  # END derived nav
