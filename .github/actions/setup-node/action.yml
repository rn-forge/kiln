name: Set up pnpm and Node
description: >-
  Install pnpm and Node for the golden-cell renders, which scaffold an Angular
  frontend. Repo-owned: kiln's generated setup action runs it as a
  [ci.hooks] setup step.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 12

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    # The Nx scaffolds install the same packages every run; without this the
    # store starts empty and every one is downloaded again. The key follows
    # the version pins in the node module.
    - name: Locate the pnpm store
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/rn_forge/kiln/modules/node/*.py') }}
        restore-keys: pnpm-store-${{ runner.os }}-
