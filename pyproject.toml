[project]
name = "rn-forge-kiln"
version = "0.1.0"
description = "The rn-forge repository generator and its canon: archetypes, golden repos, and the standard every repo is held to."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
keywords = ["generator", "repository", "standards", "scaffolding", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rn-forge/kiln"
Documentation = "https://rn-forge.github.io/kiln/"
Repository = "https://github.com/rn-forge/kiln"
Issues = "https://github.com/rn-forge/kiln/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rn_forge.kiln"
namespace = true
source-exclude = ["**/.DS_Store"]

[tool.pyright]
typeCheckingMode = "strict"
# The golden repos are fixtures: complete repos with their own pyright and ruff
# settings, checked by their own `task validate`. Type-checking them from here
# would hold them to this repo's configuration instead of their archetype's,
# which is the opposite of what they are for.
exclude = ["tests/fixtures", ".venv"]
ignore = ["tests"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# Same reason: a golden repo's tests are run by that repo's own `task test`.
norecursedirs = ["fixtures"]

[tool.ruff]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]

[dependency-groups]
dev = [
  "import-linter>=2.3",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0",
  "ruff>=0.15.21",
]
docs = [
  "mdformat>=1.0.0",
  "mdformat-gfm>=0.4",
  "mdformat-front-matters>=2.0.0",
  "mdformat-mkdocs>=5.3.0",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
]
