site_name: kiln
site_description: The rn-forge repository standard, its decisions, and the generator that renders it.
docs_dir: docs
exclude_docs: "_*"
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  # BEGIN generated nav
  - Home: index.md
  - Architecture:
    - Overview: architecture/index.md
    - Workspace: architecture/workspace.md
  - Guides:
    - Overview: guides/index.md
    - Development: guides/development.md
  - Runbooks:
    - Overview: runbooks/index.md
    - Creating A Repo: runbooks/creating-a-repo.md
    - Carrying Specs And Decisions: runbooks/carrying-specs-and-decisions.md
  - Reference:
    - Python API: reference/python-api.md
    - Standard Repo: reference/standard-repo.md
  - Releases: releases/index.md
  - Specs: specs/index.md
  - Decisions: adr/index.md
  - Plans:
    - Overview: plans/index.md
    - Context: plans/context.md
    - Overview: plans/reviews/index.md
    - Intellibuild: plans/intellibuild.md
    - Agent Config Future: plans/agent-config-future.md
    - Standardization Plan: plans/standardization-plan.md
  # END generated nav
  # The nav above is generated by `kiln docs-nav` from docs/_areas.yml
  # and the tree — do not hand-edit between the markers; run `task docs:nav`
  # after adding a page. `task lint` fails on a stale block.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
