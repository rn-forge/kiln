# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: Deploy documentation

# Builds the MkDocs site and publishes it to GitHub Pages. Nothing built here
# is committed. The strict build also runs in CI's validate job, so a docs
# break cannot merge and only then fail on deploy.
#
# NOTE: GitHub Pages must be enabled in repo settings with Source: GitHub
# Actions. That is a one-time manual step no workflow can do for you.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Build docs site
        run: task docs:build -- "$RUNNER_TEMP/site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
