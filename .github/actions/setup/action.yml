# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: Set up the toolchain
description: >-
  Install the pinned interpreter and go-task, and nothing else. Every CI job
  starts with these three steps; a composite action is how they stay one copy
  instead of four (kiln ADR-0006).

inputs:
  fetch-depth:
    description: Checkout depth. Sonar needs full history; nothing else does.
    required: false
    default: "1"
  github-token:
    description: Token for setup-task's release lookup, to avoid rate limits.
    required: true

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.14"

    - name: Install go-task
      uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
      with:
        version: 3.x
        repo-token: ${{ inputs.github-token }}
