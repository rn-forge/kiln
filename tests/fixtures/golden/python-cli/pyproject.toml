[project]
name = "golden-cli"
version = "0.1.0"
description = "The python-cli archetype's golden repo — the byte-exact oracle for kiln's templates."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["rn-forge-commons>=0.2.2"]

# pykit publishes GitHub Releases rather than to PyPI, so rn-forge libraries are
# git sources. The tag is what makes that reproducible: a branch source changes
# what this repo builds without changing a tracked byte in it (kiln ADR-0009).
[tool.uv.sources]
rn-forge-commons = { git = "https://github.com/rn-forge/pykit", subdirectory = "packages/rn-forge-commons", tag = "rn-forge-commons-v0.2.2" }

[project.scripts]
golden-cli = "golden_cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
ignore = ["tests"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]

[tool.uv.build-backend]
module-name = "golden_cli"
source-exclude = ["**/.DS_Store"]

[dependency-groups]
dev = [
  "import-linter>=2.3",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
]
