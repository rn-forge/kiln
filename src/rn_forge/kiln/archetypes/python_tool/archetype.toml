# The python-tool archetype (kiln ADR-0005): python-app with `lifecycle = true`.
name = "python-tool"
modules = ["core", "python", "docs", "tasks", "cicd", "instructions"]
# kiln itself is on the list: CI reaches it only through a committed `task` entrypoint.
forbidden_tools = [
    "uv",
    "pytest",
    "ruff",
    "pyright",
    "mkdocs",
    "lint-imports",
    "kiln",
]
required_validate = [
    "python:lint",
    "kiln:doctor",
    "python:lint:imports",
    "ci:lint:workflows",
    "python:lint:audit",
    "quality:lint:markdown",
    "quality:lint:toml",
    "python:typecheck",
    "python:test",
]

[dependencies]
required = ["rn-forge-commons", "rn-forge-cli", "rn-forge-tooling"]
allowed = ["rn-forge-commons", "rn-forge-cli", "rn-forge-tooling"]
