# kiln's declared command line, shipped inside the wheel.
#
# Every other rn-forge repo declares its `[cli]` table once, in
# `.rn-forge/kiln/config.toml`, and resolves it relative to its checkout — a
# repo runs from where it lives. kiln does not: it is a pinned dev dependency
# of every repo it generates (kiln ADR-0006), so an installed kiln has no
# checkout to look beside. The declaration therefore ships in the package, and
# `tests/test_cli_surface.py` fails if it and `.rn-forge/kiln/config.toml`
# disagree. F4.8 makes one render the other and the test goes away.
[cli]
name = "kiln"
help = "The rn-forge repository generator, and the canon it generates against."

[[cli.commands]]
name = "doctor"
target = "rn_forge.kiln.commands:doctor"

[[cli.commands]]
name = "docs-nav"
target = "rn_forge.kiln.commands:docs_nav"

[[cli.commands]]
name = "new"
target = "rn_forge.kiln.commands:new"

[[cli.commands]]
name = "apply"
target = "rn_forge.kiln.commands:apply"

[[cli.commands]]
name = "config-update"
target = "rn_forge.kiln.commands:config_update"

[[cli.commands]]
name = "config-upgrade"
target = "rn_forge.kiln.commands:config_upgrade"

[[cli.commands]]
name = "diff"
target = "rn_forge.kiln.commands:diff"

[[cli.commands]]
name = "version"
target = "rn_forge.kiln.commands:version"

[[cli.commands]]
name = "self-doctor"
target = "rn_forge.kiln.commands:self_doctor"

# `doctor` is excluded: `kiln doctor` already means inspecting a generated
# repository, and mounting the lifecycle verb's own `doctor` here would
# collide (S4.5.5). Its install-health check is `kiln self-doctor` instead.
[cli.lifecycle]
product = "rn_forge.kiln.product:PRODUCT"
target = "rn_forge.tooling.cli.lifecycle:lifecycle_commands"
verbs = ["install", "upgrade", "uninstall", "cleanup", "status"]
