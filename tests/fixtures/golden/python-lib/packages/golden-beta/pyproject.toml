[project]
name = "golden-beta"
version = "0.1.0"
description = "Trivial workspace package beta — the python-lib golden repo's product."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
# pykit publishes GitHub Releases rather than to PyPI, so rn-forge libraries are
# git sources. The URL lives in `dependencies`, not in [tool.uv.sources]: a
# source override is local and does not survive into a built wheel, so a
# consumer of this package's release could not resolve commons at all
# (kiln ADR-0005).
dependencies = [
  "rn-forge-commons @ git+https://github.com/rn-forge/pykit@rn-forge-commons-v0.2.2#subdirectory=packages/rn-forge-commons",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "golden_beta"
source-exclude = ["**/.DS_Store"]

[tool.pyright]
typeCheckingMode = "strict"
ignore = ["tests"]
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN", "PLR2004"]
