name: Set up pnpm and Node
description: >-
  Install pnpm and Node for the golden-cell renders, which scaffold an Angular
  frontend. Repo-owned: kiln's generated setup action runs it as a
  [ci.hooks] setup step.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 12

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
