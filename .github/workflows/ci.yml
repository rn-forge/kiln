# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: CI

# validate → plan → test, integration, smoke, suites → sonar → release → verify-release, docs.
#
# validate: the repository-wide checks (lint, typecheck, docs build), once.
# plan:     reads the uv workspace (here a workspace of one member, the root project) and selects the changed packages and their
#           dependents, as the outputs every later job reads.
# test:     one job per selected package — `task test`.
# integration, smoke, suites: the jobs a package or the workspace declares —
#           tests against the service containers a package declares, one extra
#           installed alone, workspace-wide pytest.
# sonar:    the scan, once test, integration and smoke have passed.
# release:  publishes the version once everything before it has passed.
# verify-release: installs what was published, from its git tag, outside the repository, and imports it.
# docs:     deploys the site to Pages once the barrier and the release stages have passed.
#
# Every step goes through `task`; `kiln doctor`'s ci-entrypoint rule fails the
# build if a step invokes uv/pytest/ruff/pyright/mkdocs/kiln directly. kiln runs
# here only as the version `[kiln] ref` pins, read-only, through
# `task validate`: it checks the tree against the committed
# .rn-forge/kiln/state.json and never runs `kiln apply`.
#
# The repeated toolchain setup lives in .github/actions/setup, committed beside
# this file. Each job checks out first: GitHub can only run a local action from
# the checked-out tree. Every `uses:` is pinned to a commit SHA with the version
# in a trailing comment. Pins move in kiln (cicd/pins.toml), not here; Dependabot
# (.github/dependabot.yml, also generated) watches only the repository's own
# actions and its uv dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI resolves the committed lock and never rewrites it. Without this a stale
  # uv.lock passes CI against a resolution nobody committed.
  UV_LOCKED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Validate
        run: task ci:validate
        env:
          KILN_DOCTOR_FULL: "1"

  # Fails a pull request that adds a dependency with a known vulnerability, from
  # GitHub's dependency graph. Skipped on a push, which `ci-ok` treats as a pass.
  dependency-review:
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Scans the full git history for leaked secrets (gitleaks, `task ci:lint:secrets`). A pull
  # request from a fork cannot be scanned with this checkout, so it is skipped, which
  # `checks-ok` treats as a pass.
  secret-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the history for secrets
        run: task ci:lint:secrets

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release-order: ${{ steps.plan.outputs.release-order }}
      packages: ${{ steps.plan.outputs.packages }}
      integration: ${{ steps.plan.outputs.integration }}
      smoke: ${{ steps.plan.outputs.smoke }}
      suites: ${{ steps.plan.outputs.suites }}
      pytest-args: ${{ steps.plan.outputs.pytest-args }}
      cov-args: ${{ steps.plan.outputs.cov-args }}
      test-paths: ${{ steps.plan.outputs.test-paths }}
      sonar-sources: ${{ steps.plan.outputs.sonar-sources }}
      sonar-tests: ${{ steps.plan.outputs.sonar-tests }}
      sonar: ${{ steps.plan.outputs.sonar }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: task ci:plan >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Test
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          PYTEST_ARGS: ${{ needs.plan.outputs.pytest-args }}
        run: task ci:test -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.name }}.test"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.name }}.test
          path: ok/
          retention-days: 1

  # For a package with `[tool.workspace-ci.integration.<service>]` tables: its
  # tests again, with the service containers `task ci:integration` starts around
  # them. A job's `services` cannot vary with the matrix leg, so the task starts
  # them.
  integration:
    name: integration (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.integration != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.integration) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Test against the declared services
        run: task ci:integration -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.marker }}"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.marker }}
          path: ok/
          retention-days: 1

  # Every other job syncs everything, which hides an extra that forgets a
  # dependency another extra brings. Each extra is installed alone, from the
  # built wheel's metadata, into a clean venv and imported.
  smoke:
    name: smoke (${{ matrix.marker }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.smoke != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and import
        env:
          EXTRA: ${{ matrix.extra }}
        run: task ci:smoke -- ${{ matrix.name }}

      - name: Record the check
        run: mkdir ok && touch "ok/${{ matrix.marker }}"

      - name: Upload the check marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ok-${{ matrix.marker }}
          path: ok/
          retention-days: 1

  # Workspace-wide pytest runs from the root `[tool.workspace-ci.suites]`.
  suites:
    name: suite (${{ matrix.name }})
    needs: [validate, plan]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.plan.outputs.suites != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Run the suite
        env:
          SUITE_ARGS: ${{ matrix.args }}
        run: task ci:suite

  sonar:
    needs: [validate, test, integration, smoke]
    # The scan runs on a same-repository pull request and on main, nowhere else.
    # A fork's pull request cannot see SONAR_TOKEN, and SonarQube Cloud's free
    # plan keeps no readable result for any other branch, so the quality-gate
    # wait fails there. Validation stays required; the scan is skipped.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      # A push or dispatch names its branch (main, by the job's `if`), so the
      # analysis lands on it explicitly. A pull request keeps the scanner's own
      # detection. A tag has no branch to analyse.
      - name: Resolve the analysis target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: task ci:sonar-target >> "$GITHUB_OUTPUT"

      - name: Test with coverage
        run: task test:coverage

      # `sonar.qualitygate.wait` is what makes the gate a gate: without it the
      # job succeeds on *submitting* the analysis, and a release can ship while
      # Sonar is still deciding it failed.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ steps.target.outputs.branch-arg }}

  release:
    needs: [plan, checks-ok]
    if: ${{ !cancelled() && needs.checks-ok.result == 'success' && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tag this run published; empty when the version was already released.
    outputs:
      tag: ${{ steps.check.outputs.should-release == 'true' && steps.check.outputs.tag || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The release, not the tag, is the record of what shipped.
      - name: Check whether this version has been released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task ci:release-state >> "$GITHUB_OUTPUT"

      # A tag without a published release is a failed release: rebuild from it.
      - name: Check out the release source
        id: source
        if: steps.check.outputs.should-release == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: task ci:release-source >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.check.outputs.should-release == 'true'
        run: task build

      # Attested before the release is published, because the release, not the
      # tag, is the record: a failure here leaves nothing published.
      - name: Generate provenance
        if: steps.check.outputs.should-release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json

      # Publishing makes the tag at the source commit; a resumed release reuses its tag.
      - name: Publish GitHub Release
        if: steps.check.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: task ci:release-publish

  verify-release:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the remote tag and a clean install
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: task ci:verify-release -- "$TAG"

  # The one Pages deploy, after the barrier and the release stages.
  docs:
    needs: [checks-ok, release, verify-release]
    if: ${{ !cancelled() && needs.checks-ok.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Build docs site
        run: task docs:build -- "$RUNNER_TEMP/site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  golden-render:
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/golden-render.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  # Everything that runs before a release, as one job: `release` and `docs` wait
  # for it, not for a list of checks. A skipped job (the fork-guarded scan, a
  # release or deploy on a pull request) passes; a failed or cancelled one does not.
  checks-ok:
    needs: [validate, dependency-review, plan, test, integration, smoke, suites, sonar, secret-scan, golden-render]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The only check branch protection requires. Job and matrix names change as
  # the repo grows; this one does not. It adds what runs after the barrier.
  ci-ok:
    needs: [checks-ok, release, verify-release, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
