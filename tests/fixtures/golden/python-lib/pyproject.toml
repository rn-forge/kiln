[project]
name = "golden-lib"
version = "0.1.0"
description = "The python-lib archetype's golden repo — a uv workspace of published library packages."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# The workspace root is not itself published: everything shippable lives in
# packages/. A `python-lib` repo releases per package, so a root distribution
# would only ever be an empty tag nobody installs.
package = false

[tool.uv.workspace]
members = ["packages/golden-alpha", "packages/golden-beta"]

# pykit publishes GitHub Releases rather than to PyPI, so rn-forge libraries are
# git sources. The tag is what makes that reproducible: a branch source changes
# what this repo builds without changing a tracked byte in it (kiln ADR-0009).
# A workspace declares the source once; each member declares the dependency.
[tool.uv.sources]
golden-alpha = { workspace = true }
golden-beta = { workspace = true }
rn-forge-commons = { git = "https://github.com/rn-forge/pykit", subdirectory = "packages/rn-forge-commons", tag = "rn-forge-commons-v0.2.2" }

[tool.pyright]
typeCheckingMode = "strict"
include = ["packages"]
ignore = ["**/tests"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["packages"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ALL"]

[dependency-groups]
workspace = ["golden-alpha", "golden-beta"]
dev = [
  { include-group = "workspace" },
  "import-linter>=2.3",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0",
  "ruff>=0.15.21",
]
docs = [
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
]
