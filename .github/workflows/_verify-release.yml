# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: Verify release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag the release published
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the remote tag and a clean install
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: task ci:verify-release -- "$TAG"
