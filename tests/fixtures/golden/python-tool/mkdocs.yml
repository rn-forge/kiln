site_name: golden-tool
site_description: The python-tool archetype's golden repo — architecture, guides, and API reference.
docs_dir: docs
exclude_docs: "_*"
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  # BEGIN generated nav
  - Home: index.md
  - Architecture:
      - Overview: architecture/index.md
      - Repository Shape: architecture/repository-shape.md
  - Guides:
      - Overview: guides/index.md
      - Development: guides/development.md
  - Runbooks:
      - Overview: runbooks/index.md
      - Recovering From Drift: runbooks/recovering-from-drift.md
  - Reference:
      - Python API: reference/python-api.md
  - Releases: releases/index.md
  - Specs: specs/index.md
  - Decisions: adr/index.md
  # END generated nav
  # The nav above is generated by scripts/docs/gen_nav.py from docs/_areas.yml
  # and the tree — do not hand-edit between the markers; run `task docs:nav`
  # after adding a page. `task lint` fails on a stale block.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
