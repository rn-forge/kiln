# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The internal implementation namespace: the uv toolchain the root wrappers
# compose. Everything here is `internal: true` — it exists to be called from a
# wrapper, not run directly.

tasks:
  install:
    desc: Sync the virtualenv with the dev and docs dependency groups.
    internal: true
    cmds:
      - uv sync --group dev --group docs

  lint:
    desc: Lint src/ (and tests/, when present) with ruff, and check formatting.
    internal: true
    cmds:
      - uv run ruff check src $(test -d tests && echo tests)
      - uv run ruff format --check src $(test -d tests && echo tests)

  lint:imports:
    desc: Enforce the import-boundary contracts in .importlinter.
    internal: true
    cmds:
      - uv run lint-imports

  lint:audit:
    desc: Fail if a locked dependency has a known vulnerability (pip-audit; needs the network).
    internal: true
    # `set -o pipefail`: go-task's shell takes only the last command's status
    # from a pipeline, so a failing `uv export` would otherwise audit nothing
    # and pass.
    cmds:
      - >-
        set -o pipefail;
        uv export --frozen --all-packages --all-groups --no-emit-workspace --no-header
        --no-emit-package rn-forge-cli
        --no-emit-package rn-forge-commons
        --no-emit-package rn-forge-django
        --no-emit-package rn-forge-fastapi
        --no-emit-package rn-forge-sqlalchemy
        --no-emit-package rn-forge-tooling
        --no-emit-package rn-forge-web
        | uv run pip-audit --disable-pip --require-hashes --strict -r /dev/stdin

  format:
    desc: Fix and format src/ (and tests/, when present) in place with ruff.
    internal: true
    # `check --fix` first, then `format`: the linter's fixes are edits, and an
    # unused-import removal or a comprehension rewrite lands unformatted unless
    # the formatter runs after it. `lint` asserts the same pair in the
    # same order.
    cmds:
      - uv run ruff check --fix src $(test -d tests && echo tests)
      - uv run ruff format src $(test -d tests && echo tests)

  typecheck:
    desc: Type-check src/ with pyright in strict mode.
    internal: true
    cmds:
      - uv run pyright src

  test:
    desc: Run the pytest suite quietly.
    internal: true
    cmds:
      - uv run pytest -q

  test:coverage:
    desc: Run the pytest suite with an XML coverage report for Sonar.
    internal: true
    cmds:
      - uv run pytest -q --cov=rn_forge.kiln --cov-report=xml:coverage.xml

  build:
    desc: Build the wheel and sdist into dist/.
    internal: true
    env:
      # Packaging must not reuse the in-repo cache — `uv build` resolves against
      # a clean tree, and a shared cache has historically leaked stale metadata.
      UV_CACHE_DIR: /tmp/kiln-uv-cache
    cmds:
      - uv build
      - uv export --format cyclonedx1.5 --frozen --no-default-groups -q -o dist/kiln.cdx.json

  version:
    desc: Print the package version from pyproject.toml.
    internal: true
    silent: true
    cmds:
      - uv version --short
