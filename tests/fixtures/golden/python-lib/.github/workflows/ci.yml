# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: CI

# validate → sonar → (per package) check-version → build → publish.
#
# The release half is a matrix over the workspace members in
# .rn-forge/kiln/config.toml, because a python-lib repo publishes each package
# on its own `<package>-v<version>` tag. The verify half is not a matrix: the
# workspace is resolved and gated once, which is also what a developer runs.
#
# Every step goes through `task`; scripts/ci/check_ci_entrypoint.py fails the
# build if a step invokes uv/pytest/ruff/pyright/mkdocs/kiln directly. kiln is
# not installed here and never will be: what CI checks is the committed
# .rn-forge/kiln/state.json baseline, through `task validate` (kiln ADR-0004).
#
# Every `uses:` is pinned to a commit SHA with the version in a trailing
# comment. Dependabot watches kiln's own repo, not this file (D21).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Validate
        run: task validate

  sonar:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Test with coverage
        run: task test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    needs: [validate, sonar]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: [golden-alpha, golden-beta]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install go-task
        uses: arduino/setup-task@bfe25a35f5c1f609e1d6153197b3b42a04ae054c # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          version="$(task version -- ${{ matrix.package }})"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # One release strategy across every repo: the tag is the record of what
      # has shipped, so a push whose version is already tagged is a no-op
      # rather than a failure (D22). Here the tag is per package.
      - name: Check whether this version has been released
        id: check
        run: |
          tag="${{ matrix.package }}-v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            printf '%s\n' "Tag $tag already exists; skipping build and release."
            printf 'should-release=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should-release=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.should-release == 'true'
        run: task build -- ${{ matrix.package }}

      - name: Configure git identity
        if: steps.check.outputs.should-release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.check.outputs.should-release == 'true'
        run: |
          tag="${{ matrix.package }}-v${{ steps.version.outputs.version }}"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Publish GitHub Release
        if: steps.check.outputs.should-release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ matrix.package }}-v${{ steps.version.outputs.version }}
          name: ${{ matrix.package }} v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
