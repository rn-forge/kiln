site_name: golden-lib
site_description: The python-lib archetype's golden repo — architecture, guides, and API reference.
docs_dir: docs
exclude_docs: "_*"
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - monorepo
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/*/src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
# The nav below is derived by `kiln docs-generate` from docs/_areas.yml and
# the tree — do not hand-edit between the markers; run `task docs:generate`
# after adding a page. `task lint` fails on a stale nav.
nav:
  # BEGIN derived nav
  - Home: index.md
  - Architecture:
    - Overview: architecture/index.md
    - Repository shape: architecture/repository-shape.md
  - Guides:
    - Overview: guides/index.md
    - Development: guides/development.md
  - Packages:
    - golden-alpha: '!include packages/golden-alpha/mkdocs.yml'
    - golden-beta: '!include packages/golden-beta/mkdocs.yml'
  - Runbooks:
    - Overview: runbooks/index.md
    - Adding a package: runbooks/adding-a-package.md
    - Recovering from drift: runbooks/recovering-from-drift.md
  - Releases: releases/index.md
  - Specs: specs/index.md
  - Decisions: adr/index.md
  # END derived nav
