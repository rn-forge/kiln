version: "3"

tasks:
  golden:render:
    desc: Render every archetype x flag cell into .goldens/<ref>/ (REF=<git-ref>; default the working tree).
    cmds:
      - uv run python scripts/golden_matrix.py render {{.REF}}

  golden:validate:
    desc: Run uv sync, task validate, actionlint and the strict docs build in every rendered cell (REF=<git-ref>).
    cmds:
      - uv run python scripts/golden_matrix.py validate {{.REF}}

  golden:compare:
    desc: Render BASE and REF (default the working tree), then diff every cell's kiln-owned (managed and block) files between them, ignoring the provenance-version line (BASE=<git-ref> [REF=<git-ref>]).
    requires:
      vars: [BASE]
    cmds:
      - uv run python scripts/golden_matrix.py render {{.BASE}}
      - uv run python scripts/golden_matrix.py render {{.REF}}
      - uv run python scripts/golden_matrix.py compare {{.BASE}} {{.REF}}
