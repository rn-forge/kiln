<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>demo docs</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --bg: #ffffff;
        --muted: #666666;
        --border: #e0e0e0;
        --accent: #6236ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f0f0f0;
          --bg: #121212;
          --muted: #a0a0a0;
          --border: #333333;
          --accent: #a78bfa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        justify-content: center;
        padding: 4rem 1.5rem;
      }
      main {
        max-width: 720px;
        width: 100%;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.25rem;
      }
      h2 {
        font-size: 1.25rem;
        margin: 2rem 0 0;
      }
      .cards {
        display: grid;
        gap: 1rem;
        margin-top: 1rem;
      }
      a.card {
        display: block;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
      }
      a.card:hover {
        border-color: var(--accent);
      }
      a.card h3 {
        margin: 0 0 0.25rem;
        font-size: 1.1rem;
        color: var(--accent);
      }
      a.card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>demo</h1>
      <h2>API reference</h2>
      <div class="cards">
        <a class="card" href="./api/core/">
          <h3>core</h3>
          <p>Core &amp; &lt;lib&gt; &quot;x&quot;</p>
        </a>
        <a class="card" href="./api/ui/">
          <h3>ui</h3>
        </a>
      </div>
      <h2>Storybook</h2>
      <div class="cards">
        <a class="card" href="./storybook/ui/">
          <h3>ui</h3>
        </a>
      </div>
    </main>
  </body>
</html>
