# The one hand-authored input kiln reads (kiln ADR-0004). Edit this, then run
# `kiln apply`. Everything else under .rn-forge/kiln/ is kiln's.
#
# kiln's own config. It is not self-hosting yet: this file, and the state.json
# beside it, are hand-authored in Phase B and become real output in Phase D,
# when kiln regenerates its own skeleton.
schema_version = 1

[repository]
name = "kiln"
archetype = "python-tool"

[docs]
profile = "mkdocs"
site_dir = ".docs-site"

[ci]
provider = "github"
sonar = true
release = "tag-exists"

[tasks]
includes = []

# The command line this repo exposes, built by `CliApp.from_config` rather
# than assembled by hand (kiln ADR-0002). F4.5 adds the rest of the surface to
# this table; `check` is here first because it is what CI runs
# (kiln ADR-0006).
[cli]
name = "kiln"
help = "The rn-forge repository generator, and the canon it generates against."

[[cli.commands]]
name = "doctor"
target = "rn_forge.kiln.commands:doctor"

[[cli.commands]]
name = "docs-nav"
target = "rn_forge.kiln.commands:docs_nav"

[[cli.commands]]
name = "new"
target = "rn_forge.kiln.commands:new"

[[cli.commands]]
name = "apply"
target = "rn_forge.kiln.commands:apply"
