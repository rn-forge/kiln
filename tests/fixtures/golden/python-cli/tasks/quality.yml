# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The internal implementation namespace: the lint/typecheck/test/format
# primitives the root wrappers compose. Everything here is `internal: true` —
# it exists to be called from a wrapper, not run directly.

tasks:
  lint:python:
    desc: Lint src/, tests/ and scripts/ with ruff, and check formatting.
    internal: true
    cmds:
      - uv run ruff check src tests scripts
      - uv run ruff format --check src tests scripts

  lint:markdown:
    desc: Check that every Markdown file in the tree is mdformat-clean.
    internal: true
    cmds:
      - uv run --group docs mdformat --check .

  lint:generated:
    desc: Fail if a kiln-generated file or block has drifted from the committed state.
    internal: true
    cmds:
      - uv run python scripts/standards/check_generated.py .

  lint:rn-forge-deps:
    desc: Enforce the archetype's rn-forge dependency contract — required, allowed, pinned.
    internal: true
    cmds:
      - uv run python scripts/standards/check_rn_forge_deps.py .

  lint:imports:
    desc: Enforce the import-boundary contracts in .importlinter.
    internal: true
    cmds:
      - uv run lint-imports

  lint:task-layout:
    desc: Enforce the wrapper/inner split, non-empty desc, and the validate gate.
    internal: true
    cmds:
      - uv run python scripts/task/check_task_layout.py .

  lint:ci-entrypoint:
    desc: Fail if a CI step invokes a wrapped tool instead of `task`.
    internal: true
    cmds:
      - uv run python scripts/ci/check_ci_entrypoint.py .

  lint:docs:
    desc: Check the docs site for broken links, bad anchors, and orphan pages.
    internal: true
    cmds:
      - uv run python scripts/docs/check_docs.py .

  lint:docs-structure:
    desc: Check the docs tree matches the area model.
    internal: true
    cmds:
      - task: :docs:structure

  lint:docs-nav:
    desc: Check mkdocs.yml's generated nav block is up to date.
    internal: true
    cmds:
      - task: :docs:nav
        vars:
          CLI_ARGS: --check

  format:python:
    desc: Fix and format src/, tests/ and scripts/ in place with ruff.
    internal: true
    # `check --fix` first, then `format`: the linter's fixes are edits, and an
    # unused-import removal or a comprehension rewrite lands unformatted unless
    # the formatter runs after it. `lint:python` asserts the same pair in the
    # same order.
    cmds:
      - uv run ruff check --fix src tests scripts
      - uv run ruff format src tests scripts

  format:markdown:
    desc: Format every Markdown file in the tree with mdformat.
    internal: true
    cmds:
      - uv run --group docs mdformat .

  typecheck:python:
    desc: Type-check src/ with pyright in strict mode.
    internal: true
    cmds:
      - uv run pyright src

  test:python:
    desc: Run the pytest suite quietly.
    internal: true
    cmds:
      - uv run pytest -q

  test:coverage:
    desc: Run the pytest suite with an XML coverage report for Sonar.
    internal: true
    cmds:
      - uv run pytest -q --cov=golden_cli --cov-report=xml:coverage.xml
