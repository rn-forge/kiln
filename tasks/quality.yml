# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The internal implementation namespace: the lint/typecheck/test/format
# primitives the root wrappers compose. Everything here is `internal: true` —
# it exists to be called from a wrapper, not run directly.

tasks:
  lint:python:
    desc: Lint src/ (and tests/, when present) with ruff, and check formatting.
    internal: true
    cmds:
      - uv run ruff check src $(test -d tests && echo tests)
      - uv run ruff format --check src $(test -d tests && echo tests)

  lint:markdown:
    desc: Check that every Markdown file in the tree is mdformat-clean.
    internal: true
    cmds:
      - uv run --group docs mdformat --check .

  lint:toml:
    desc: Check that every TOML file in the tree is taplo-formatted.
    internal: true
    cmds:
      - uv run taplo fmt --check

  lint:generated:
    desc: Fail if a kiln-generated file or block has drifted from the committed state.
    internal: true
    cmds:
      - uv run kiln doctor . --only generated
      - cmd: uv run kiln doctor . --full
        if: '[ -n "{{.KILN_DOCTOR_FULL}}" ]'

  lint:rn-forge-deps:
    desc: Enforce the archetype's rn-forge dependency contract — required, allowed, pinned.
    internal: true
    cmds:
      - uv run kiln doctor . --only rn-forge-deps

  lint:imports:
    desc: Enforce the import-boundary contracts in .importlinter.
    internal: true
    cmds:
      - uv run lint-imports

  lint:task-layout:
    desc: Enforce the wrapper/inner split, non-empty desc, and the validate gate.
    internal: true
    cmds:
      - uv run kiln doctor . --only task-layout

  lint:ci-entrypoint:
    desc: Fail if a CI step invokes a wrapped tool instead of `task`.
    internal: true
    cmds:
      - uv run kiln doctor . --only ci-entrypoint

  lint:ci-pins:
    desc: Fail if a CI action is not pinned to a commit, or a job lacks `permissions:`.
    internal: true
    cmds:
      - uv run kiln doctor . --only ci-pins

  lint:ci-hooks:
    desc: Fail if a `[ci.hooks]` action or a declared job's workflow is missing or cannot be called.
    internal: true
    cmds:
      - uv run kiln doctor . --only ci-hooks

  lint:workflows:
    desc: Fail on a workflow security finding (zizmor) or a workflow syntax error (actionlint).
    internal: true
    cmds:
      - uv run zizmor --offline .github
      - uv run actionlint

  lint:audit:
    desc: Fail if a locked dependency has a known vulnerability (pip-audit; needs the network).
    internal: true
    # `set -o pipefail`: go-task's shell takes only the last command's status
    # from a pipeline, so a failing `uv export` would otherwise audit nothing
    # and pass.
    cmds:
      - >-
        set -o pipefail;
        uv export --frozen --all-packages --all-groups --no-emit-workspace --no-header
        --no-emit-package rn-forge-cli
        --no-emit-package rn-forge-commons
        --no-emit-package rn-forge-devops
        --no-emit-package rn-forge-django
        --no-emit-package rn-forge-fastapi
        --no-emit-package rn-forge-sqlalchemy
        --no-emit-package rn-forge-tooling
        --no-emit-package rn-forge-web
        --no-emit-package rn-forge-kiln
        | uv run pip-audit --disable-pip --no-deps --strict -r /dev/stdin

  format:python:
    desc: Fix and format src/ (and tests/, when present) in place with ruff.
    internal: true
    # `check --fix` first, then `format`: the linter's fixes are edits, and an
    # unused-import removal or a comprehension rewrite lands unformatted unless
    # the formatter runs after it. `lint:python` asserts the same pair in the
    # same order.
    cmds:
      - uv run ruff check --fix src $(test -d tests && echo tests)
      - uv run ruff format src $(test -d tests && echo tests)

  format:markdown:
    desc: Format every Markdown file in the tree with mdformat.
    internal: true
    cmds:
      - uv run --group docs mdformat .

  format:toml:
    desc: Format every TOML file in the tree with taplo.
    internal: true
    cmds:
      - uv run taplo fmt

  typecheck:python:
    desc: Type-check src/ with pyright in strict mode.
    internal: true
    cmds:
      - uv run pyright src

  test:python:
    desc: Run the pytest suite quietly.
    internal: true
    cmds:
      - uv run pytest -q

  test:coverage:
    desc: Run the pytest suite with an XML coverage report for Sonar.
    internal: true
    cmds:
      - uv run pytest -q --cov=rn_forge.kiln --cov-report=xml:coverage.xml
