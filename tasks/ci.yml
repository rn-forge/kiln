version: "3"

# The CI module's checks on what it generates, internal, run by `lint`.

tasks:
  lint:entrypoint:
    desc: Fail if a CI step invokes a wrapped tool instead of `task`.
    internal: true
    cmds:
      - uv run kiln doctor . --only ci-entrypoint

  lint:pins:
    desc: Fail if a CI action is not pinned to a commit, or a job lacks `permissions:`.
    internal: true
    cmds:
      - uv run kiln doctor . --only ci-pins

  lint:hooks:
    desc: Fail if a `[ci.hooks]` action or a declared job's workflow is missing or cannot be called.
    internal: true
    cmds:
      - uv run kiln doctor . --only ci-hooks

  lint:workflows:
    desc: Fail on a workflow security finding (zizmor) or a workflow syntax error (actionlint).
    internal: true
    cmds:
      - uv run zizmor --offline .github
      - uv run actionlint
