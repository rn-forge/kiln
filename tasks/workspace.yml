# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# Everything that acts on the workspace as a whole: dependency sync, packaging,
# the version read, and cleanup. Internal — reached through the root wrappers.

tasks:
  install:
    desc: Sync the virtualenv with the dev and docs dependency groups.
    internal: true
    cmds:
      - uv sync --group dev --group docs

  version:
    desc: Print the package version from pyproject.toml.
    internal: true
    silent: true
    cmds:
      - uv version --short

  build:
    desc: Build the wheel and sdist into dist/.
    internal: true
    env:
      # Packaging must not reuse the in-repo cache — `uv build` resolves against
      # a clean tree, and a shared cache has historically leaked stale metadata.
      UV_CACHE_DIR: /tmp/kiln-uv-cache
    cmds:
      - uv build

  clean:
    desc: Remove build outputs, tool caches, and the rendered docs site.
    internal: true
    cmds:
      - rm -rf dist build .docs-site .pytest_cache .ruff_cache .uv-cache .import_linter_cache coverage.xml
      - find . -type d -name __pycache__ -not -path './.venv/*' -exec rm -rf {} +
