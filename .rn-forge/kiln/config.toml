# The one hand-authored input kiln reads (kiln ADR-0004). Edit this, then run
# `kiln apply`. Everything else under .rn-forge/kiln/ is kiln's.

# The config schema this file was written for. `kiln config-upgrade`
# raises it; do not edit it by hand.
schema_version = 1

# What the repository asserts about itself.
[repository]
# The repository's name. It names the package and the project and is
# written into generated files. Changing it re-renders them on `kiln apply`:
# generated files follow the name, and seeded files keep the name they were
# created with (the root `pyproject.toml`'s `[project].name`,
# `<name>.code-workspace`).
name = "kiln"

# The GitHub owner (user or organisation) that holds the repository. It
# forms the absolute URLs kiln writes: each package's `[project.urls]` and
# the docs site's `site_url` and `repo_url`. There is no default. `kiln new`
# takes it from `--owner`.
owner = "rn-forge"

# The repository's shape, which sets its modules, files and dependencies.
# Changing it re-renders most generated files, and `kiln apply` does not
# migrate the code itself.
archetype = "python-app"

# Whether the repository installs itself as a tool (`kiln self` verbs).
# `python-tool` always does. Changing it adds or removes the lifecycle files
# on `kiln apply`.
# Default: false.
lifecycle = true

# The command line this repository exposes, read by rn-forge-cli's
# `CliApp.from_config` and carried as written. `kiln apply` does not read it.
[cli]
name = "kiln"
help = "The rn-forge repository generator, and the canon it generates against."
default_log_level = "info"

[[cli.commands]]
name = "doctor"
target = "rn_forge.kiln.commands:doctor"

[[cli.commands]]
name = "docs-generate"
target = "rn_forge.kiln.commands:docs_generate"

[[cli.commands]]
name = "new"
target = "rn_forge.kiln.commands:new"

[[cli.commands]]
name = "apply"
target = "rn_forge.kiln.commands:apply"

[[cli.commands]]
name = "generate"
target = "rn_forge.kiln.commands:generate_app"

[[cli.commands]]
name = "config-update"
target = "rn_forge.kiln.commands:config_update"

[[cli.commands]]
name = "config-upgrade"
target = "rn_forge.kiln.commands:config_upgrade"

[[cli.commands]]
name = "diff"
target = "rn_forge.kiln.commands:diff"

[[cli.commands]]
name = "version"
target = "rn_forge.kiln.commands:version"

[[cli.commands]]
name = "prompt"
target = "rn_forge.kiln.commands:prompt"

# The lifecycle verbs mounted under the CLI, read by rn-forge-tooling's
# `build_tool_app` and carried as written. `kiln apply` does not read it.
[lifecycle]
product = "rn_forge.kiln.product:PRODUCT"
namespace = "self"
verbs = [
    "install",
    "upgrade",
    "uninstall",
    "cleanup",
    "status",
    "doctor",
]

# The `python-app` archetype's settings.
[archetype.python-app]
# Workspace member directories, one per package. `kiln apply` renders each
# member's `pyproject.toml`, tasks and CI entries; adding one needs
# `kiln new` or `init` to create its files first.
# Default: [].
packages = []

# The package's dotted import module. Changing it rewrites the build
# backend, import contracts and test and Sonar paths on `kiln apply`.
# Default: the repository name with `-` as `_`.
module = "rn_forge.kiln"

# The import module of a member whose name differs from its directory,
# keyed by the member's path in `packages`. Changing it rewrites the member's
# build and import-contract settings on `kiln apply`.
# Default: {}.
[archetype.python-app.modules]

# How the repo publishes its documentation.
[docs]
# How the docs are published. `mkdocs` renders the docs tree, `mkdocs.yml`
# and the docs tasks and CI job; `external` links to docs hosted elsewhere;
# `none` has no docs. Changing it adds or removes those files on `kiln apply`.
# One of: "mkdocs", "external", "none".
# Default: "none".
profile = "mkdocs"

# Where `mkdocs` builds the site. It is ignored by git and cleaned by
# `task clean`; changing it rewrites `.gitignore`, the docs tasks and the CI
# workflows on `kiln apply`. `mkdocs` only.
# Default: ".docs-site".
site_dir = ".docs-site"

# Where the docs live, linked from the generated `AGENTS.md` block. Changing
# it rewrites that block on `kiln apply`. `external` only.
# Default: "".
external_url = ""

# Settings added to the rendered `mkdocs.yml`. `mkdocs` only.
[docs.mkdocs]
# Replaces the `site_description` in `mkdocs.yml`. Changing it rewrites
# `mkdocs.yml` on `kiln apply`.
# Default: the description kiln renders.
site_description = "The rn-forge repository standard, its decisions, and the generator that renders it."

# Repo-owned taskfiles the generated `Taskfile.yml` includes. Changing
# the list rewrites `Taskfile.yml` on `kiln apply`.
[[tasks.includes]]
# The namespace its tasks are called under (`task <namespace>:<task>`).
# Changing it rewrites the include in `Taskfile.yml` on `kiln apply`.
namespace = "self"

# The taskfile's path, relative to the repository root. Changing it
# rewrites the include in `Taskfile.yml` on `kiln apply`.
taskfile = "tasks/self.yml"

# Extra tasks a root verb calls, keyed by that verb (`validate`, `test`, ...).
# Changing it rewrites the root verb in `Taskfile.yml` on `kiln apply`.
# Default: {}.
[tasks.extra_refs]

# A replacement command for an inner task, keyed by the task's name.
# Changing it rewrites that task in `tasks/*.yml` on `kiln apply`.
# Default: {}.
[tasks.command_overrides]

# Which CI provider the workflows target, and what they run.
[ci]
# The CI provider the workflows target. `ado` is reserved and not yet
# rendered; changing it re-renders the CI files on `kiln apply`.
# One of: "github", "ado".
# Default: "github".
provider = "github"

# Whether CI runs a Sonar analysis. Turning it off removes the Sonar job and
# its properties file on `kiln apply`.
# Default: true.
sonar = true

# How a release is published: `tag-exists` tags the default branch, `pypi`
# publishes a library to PyPI, `nx-dispatch` is the `node-lib` flow, and
# `none` has no release job. Changing it rewrites the release workflow on
# `kiln apply`.
# One of: "tag-exists", "pypi", "nx-dispatch", "none".
# Default: `tag-exists`; `nx-dispatch` for `node-lib`.
release = "tag-exists"

# When CI runs `kiln doctor --full`: on pushes to the default branch and on
# dispatch, or on every run. Changing it rewrites the validate job in
# `ci.yml` on `kiln apply`.
# One of: "default-branch", "every-run".
# Default: "default-branch".
doctor_full = "every-run"

# Paths Sonar skips, added to the archetype's own. Changing the list rewrites
# the Sonar properties on `kiln apply`.
# Default: [].
sonar_exclusions = []

# Paths Sonar counts but does not expect to have coverage. Changing the list
# rewrites the Sonar properties on `kiln apply`.
# Default: [].
sonar_coverage_exclusions = []

# Local actions the generated CI runs at its extension points.
[ci.hooks]
# Local composite actions the generated setup action runs as its last steps.
# Changing the list rewrites the setup action on `kiln apply`.
# Default: [].
setup = [
    "./.github/actions/setup-node",
]

# Local composite actions every Pages-uploading job runs before the upload,
# with `SITE_DIR` set. Changing the list rewrites the workflows on
# `kiln apply`.
# Default: [].
docs = []

# Extra jobs, each calling one reusable workflow after `validate`. Changing
# the list rewrites `ci.yml` on `kiln apply`.
[[ci.jobs]]
# The job's name in `ci.yml`: kebab-case, and not a job kiln generates.
# Changing it renames the job on `kiln apply`.
name = "golden-render"

# The called workflow: `./.github/workflows/<file>.yml`, not `ci.yml`.
# Changing it rewrites the job in `ci.yml` on `kiln apply`.
uses = "./.github/workflows/golden-render.yml"

# The events the job runs on. Changing them rewrites the job's condition in
# `ci.yml` on `kiln apply`.
# One of: "pull_request", "push", "workflow_dispatch".
# Default: ["pull_request", "push", "workflow_dispatch"].
events = [
    "pull_request",
]

# The job's `contents` permission; `write` for a job that creates releases.
# Changing it rewrites the job's permissions in `ci.yml` on `kiln apply`.
# One of: "read", "write".
# Default: "read".
contents = "read"
