# Generated by kiln golden from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: CI

# validate → sonar → release.
#
# Every step goes through `task`; `kiln doctor`'s ci-entrypoint rule fails the
# build if a step invokes uv/pytest/ruff/pyright/mkdocs/kiln directly. kiln is
# not installed here and never will be: what CI checks is the committed
# .rn-forge/kiln/state.json baseline, through `task validate` (kiln ADR-0006).
#
# The repeated toolchain setup lives in .github/actions/setup, committed beside
# this file. Each job checks out first: GitHub can only run a local action from
# the checked-out tree. Every `uses:` is pinned to a commit SHA with the version
# in a trailing comment. Pins move in kiln (cicd/pins.toml), not here; Dependabot
# (.github/dependabot.yml, also generated) watches only the repository's own
# actions and its uv dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI resolves the committed lock and never rewrites it. Without this a stale
  # uv.lock passes CI against a resolution nobody committed.
  UV_LOCKED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      - name: Validate
        run: task validate

  golden-render:
    # Every shipped archetype x flag cell must still render (S4.4.2). Validating
    # the cells stays local: `task self:golden:validate`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The python-web-app cell scaffolds its Angular frontend with pnpm and
      # Node, which kiln's own setup action does not install.
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: task setup

      - name: Render every golden cell
        run: task self:golden:render

  sonar:
    needs: validate
    # A fork's pull request cannot see SONAR_TOKEN, so an unconditional scan job
    # fails on every external contribution. Validation stays required; the scan
    # is skipped where its credential cannot exist.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      # A push or dispatch names its branch, so the analysis lands on that
      # branch rather than the project's main. A pull request keeps the
      # scanner's own detection. A tag has no branch to analyse.
      - name: Resolve the analysis target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            printf 'branch-arg=\n' >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" = tag ]; then
            printf '%s\n' "Sonar analyses branches, not tags: $REF_NAME" >&2
            exit 1
          else
            printf 'branch-arg=-Dsonar.branch.name=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Test with coverage
        run: task test:coverage

      # `sonar.qualitygate.wait` is what makes the gate a gate: without it the
      # job succeeds on *submitting* the analysis, and a release can ship while
      # Sonar is still deciding it failed.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ steps.target.outputs.branch-arg }}

  release:
    needs: [validate, sonar]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          version="$(task version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # The *release* is the record of what shipped, not the tag (D22). Checking
      # the tag instead would make a half-finished publish permanent: the tag
      # would exist, the release would not, and every rerun would skip.
      - name: Check whether this version has been released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = false ]; then
            printf '%s\n' "Release $tag already published; nothing to do."
            printf 'should-release=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'should-release=true\n' >> "$GITHUB_OUTPUT"
          printf 'draft=%s\n' "$([ "$draft" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            printf 'tagged=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'tagged=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # A tag without a published release is a release that failed after
      # tagging; rebuilding from `HEAD` would ship a different commit under
      # that version.
      - name: Check out the tagged source
        if: steps.check.outputs.tagged == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" && git checkout --detach "$TAG"

      - name: Record the source commit
        id: source
        if: steps.check.outputs.should-release == 'true'
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.check.outputs.should-release == 'true'
        run: task build

      - name: Delete the leftover draft
        if: steps.check.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh release delete "$TAG" --yes

      # `gh release create` makes the tag itself at `--target`, as part of
      # publishing. Tagging in a separate earlier step is what made a failed
      # upload unrecoverable. On a resumed release the tag already exists and
      # is reused as it is.
      - name: Publish GitHub Release
        if: steps.check.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAGGED: ${{ steps.check.outputs.tagged }}
        run: |
          set -euo pipefail
          if [ "$TAGGED" = true ]; then
            gh release create "$TAG" dist/*.whl dist/*.tar.gz --verify-tag --title "$TAG" --generate-notes
          else
            gh release create "$TAG" dist/*.whl dist/*.tar.gz --target "$SOURCE_SHA" --title "$TAG" --generate-notes
          fi

  # The only check branch protection requires. Job and matrix names change as
  # the repo grows; this one does not. A skipped job (the fork-guarded scan, a
  # release on a pull request) is not a failure.
  ci-ok:
    needs: [validate, golden-render, sonar, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
