[project]
name = "golden-lib"
version = "0.1.0"
description = "The python-lib archetype's golden repo — a uv workspace of published library packages."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohit Narayanan", email = "rohit.nn@gmail.com" }]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# The workspace root is not itself published: everything shippable lives in
# packages/. A `python-lib` repo releases per package, so a root distribution
# would only ever be an empty tag nobody installs.
package = false

[tool.uv.workspace]
members = ["packages/golden-alpha", "packages/golden-beta"]

# Workspace members resolve to each other; rn-forge libraries do not appear here
# at all. Their URLs live in each member's `dependencies`, because a source
# override is local and does not survive into a built wheel (the dependency specification).
[tool.uv.sources]
golden-alpha = { workspace = true }
golden-beta = { workspace = true }
# kiln is a pinned dev dependency (kiln ADR-0006), taken from the kiln checkout
# these goldens live in; the path goes when the goldens leave git (kiln F4.4).
rn-forge-kiln = { path = "../../../..", editable = true }

[tool.pyright]
typeCheckingMode = "strict"
include = ["packages"]
ignore = ["**/tests"]
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# importlib mode keeps same-named test modules in different packages from
# colliding — two `test_utils.py` under a workspace is normal, not a mistake.
addopts = "-ra --import-mode=importlib"
testpaths = ["packages"]

[tool.coverage.run]
# `source` is passed per run instead: each package covers its own src/, and a
# repo-wide list would warn about every module the current run did not import.
relative_files = false

[tool.ruff.lint.per-file-ignores]
# Not a blanket exemption: tests are code. These are the rules that fight the
# way a test is written, and nothing else.
"**/tests/*" = [
  "S101",    # assert is the point
  "D",       # a test name is its docstring
  "ANN",     # annotations on a test add nothing
  "PLR2004", # a literal in an assertion is the expected value
]

[dependency-groups]
workspace = ["golden-alpha", "golden-beta"]
dev = [
  { include-group = "workspace" },
  "import-linter>=2.3",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "coverage[toml]>=7.6",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0",
  "rn-forge-kiln",
  "ruff>=0.15.21",
]
docs = [
  "mdformat>=1.0.0",
  "mdformat-gfm>=0.4",
  "mdformat-front-matters>=2.0.0",
  "mdformat-mkdocs>=5.3.0",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.30",
]
